<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>PCOS · 90 DAYS</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app">
<section class="card hero"><p class="eyebrow">PCOS · 90 DAYS</p><h1 id="dayTitle">Week 1 · Day 1</h1><p class="muted">2026.09.23 开始 · 12 周生活方式管理</p><div class="weights"><div><small>START</small><b id="startW">76.6</b><span>kg</span></div><i>→</i><div><small>GOAL</small><b id="goalW">73.0</b><span>kg</span></div></div></section>
<section class="card clock"><div><p class="eyebrow">LOCAL TIME · 本机时间</p><h2 id="clock">--:--:--</h2><p class="muted" id="dateText"></p></div><div class="clock-status"><b id="planState"></b><span id="planCountdown"></span></div></section>
<section class="card pill"><div><p class="eyebrow">MEDICATION</p><h2 id="cycle">优思明 · Cycle 1</h2><p class="muted" id="pillStatus">今晚 22:00</p><small id="pillHint"></small></div><button id="pillBtn">💊 打卡</button></section>
<div class="title"><h2>TODAY</h2><button class="ghost" id="backfillBtn">＋ 补记</button></div>
<section class="grid"><button class="card quick" data-add="weight">⚖️<b>体重</b><small id="weightMini">记录</small></button><button class="card quick" data-add="food">🍽️<b>饮食</b><small id="foodMini">0 餐</small></button><button class="card quick" data-add="workout">🏃<b>运动</b><small id="workoutMini">未记录</small></button><button class="card quick" data-add="sleep">😴<b>睡眠</b><small id="sleepMini">未记录</small></button><button class="card quick" data-add="body">🙂<b>身体状态</b><small>记录</small></button></section>
<section class="card daily-card"><div class="title inner"><h2>✨ 今日分析</h2><button id="analysisBtn" class="analysisBtn" disabled>✨ 生成今日分析</button></div><p id="analysisCountdown" class="muted"></p><div id="dailyAnalysis" class="empty">今天还没有生成分析</div></section>
<section class="card"><div class="title inner"><h2>今日饮食</h2><button class="link" data-add="food">＋ 添加</button></div><div id="foods" class="empty">今天还没有饮食记录</div></section>
<section class="card"><div class="title inner"><h2>今日运动</h2><button class="link" data-add="workout">＋ 添加</button></div><div id="workouts" class="empty">今天还没有运动记录</div></section>
<section class="card"><div class="title inner"><h2>睡眠记录</h2><button class="link" data-add="sleep">＋ 记录</button></div><div id="sleeps" class="empty">还没有睡眠记录</div></section>
<section class="card"><div class="title inner"><h2>最近体重</h2><button class="link" data-add="weight">＋ 记录</button></div><div id="weights" class="empty">还没有体重记录</div></section>
<section class="card"><div class="title inner"><h2>数据安全</h2></div><p class="muted">记录只保存在当前浏览器。升级代码不会主动删除数据；换浏览器/设备前请导出备份。</p><div class="actions"><button id="exportBtn">导出 JSON 备份</button><button id="importBtn">导入备份</button><input id="importFile" type="file" accept=".json,application/json" hidden></div><p id="migrationNote" class="migration"></p></section>
</main>
<nav><button>⌂<small>Today</small></button><button data-add="food">🍽<small>Food</small></button><button class="plus" id="navPlus">＋</button><button data-add="weight">⌁<small>Progress</small></button><button id="meBtn">☻<small>Me</small></button></nav>
<dialog id="modal"><div class="modalHead"><h2 id="modalTitle"></h2><button id="close">×</button></div><div id="modalBody"></div></dialog>
<script src="app.js"></script></body></html>
